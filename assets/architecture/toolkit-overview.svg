<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="serve" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#444444" stroke-width="1.4"/>
    </marker>
  </defs>
  <style>
    .biz  { fill:#FFF6C8; stroke:#C9A227; stroke-width:1.5; }
    .app  { fill:#CDEFEF; stroke:#3E8E8E; stroke-width:1.5; }
    .lbl  { font-size:13px; fill:#1a1a1a; }
    .lblb { font-size:13px; fill:#1a1a1a; font-weight:bold; }
    .sub  { font-size:11px; fill:#444; }
    .serve{ stroke:#444444; stroke-width:1.4; fill:none; marker-end:url(#serve); }
    .assoc{ stroke:#7a7a7a; stroke-width:1.2; stroke-dasharray:4 3; fill:none; }
    .tiny { font-size:10px; fill:#666; }
  </style>

  <text x="30" y="30" font-size="17" font-weight="bold" fill="#1F3A5F">Data Governance Toolkit - Operating Model</text>

  <!-- Business Service -->
  <rect x="30" y="50" width="840" height="50" rx="22" class="biz"/>
  <text x="450" y="80" text-anchor="middle" class="lblb">Data Governance - compliance that survives an audit</text>

  <!-- helper: component icon lugs drawn per component below -->

  <!-- Business Processes -->
  <g>
    <rect x="40" y="170" width="180" height="64" rx="14" class="biz"/>
    <text x="130" y="207" text-anchor="middle" class="lbl">Classify Data</text>
    <rect x="245" y="170" width="180" height="64" rx="14" class="biz"/>
    <text x="335" y="207" text-anchor="middle" class="lbl">Maintain ROPA</text>
    <rect x="475" y="170" width="180" height="64" rx="14" class="biz"/>
    <text x="565" y="207" text-anchor="middle" class="lbl">Conduct DPIA</text>
    <rect x="680" y="170" width="180" height="64" rx="14" class="biz"/>
    <text x="770" y="200" text-anchor="middle" class="lbl">Assess</text>
    <text x="770" y="216" text-anchor="middle" class="lbl">AI-System Risk</text>
  </g>

  <!-- Application Components (templates) with little lugs -->
  <g>
    <!-- c1 -->
    <rect x="40" y="300" width="180" height="64" class="app"/>
    <rect x="36" y="312" width="12" height="8" class="app"/><rect x="36" y="328" width="12" height="8" class="app"/>
    <text x="130" y="337" text-anchor="middle" class="lbl">Classification Matrix</text>
    <!-- c2 -->
    <rect x="245" y="300" width="180" height="64" class="app"/>
    <rect x="241" y="312" width="12" height="8" class="app"/><rect x="241" y="328" width="12" height="8" class="app"/>
    <text x="335" y="337" text-anchor="middle" class="lbl">ROPA Register</text>
    <!-- c3 -->
    <rect x="475" y="300" width="180" height="64" class="app"/>
    <rect x="471" y="312" width="12" height="8" class="app"/><rect x="471" y="328" width="12" height="8" class="app"/>
    <text x="565" y="337" text-anchor="middle" class="lbl">DPIA Template</text>
    <!-- c4 -->
    <rect x="680" y="300" width="180" height="64" class="app"/>
    <rect x="676" y="312" width="12" height="8" class="app"/><rect x="676" y="328" width="12" height="8" class="app"/>
    <text x="770" y="330" text-anchor="middle" class="lbl">AI-System</text>
    <text x="770" y="346" text-anchor="middle" class="lbl">Risk Checklist</text>
  </g>

  <!-- Supporting components -->
  <g>
    <rect x="245" y="440" width="180" height="60" class="app"/>
    <rect x="241" y="452" width="12" height="8" class="app"/><rect x="241" y="468" width="12" height="8" class="app"/>
    <text x="335" y="466" text-anchor="middle" class="lbl">Frameworks Crosswalk</text>
    <text x="335" y="482" text-anchor="middle" class="sub">GDPR · PDPL · EU AI Act</text>
    <rect x="475" y="440" width="180" height="60" class="app"/>
    <rect x="471" y="452" width="12" height="8" class="app"/><rect x="471" y="468" width="12" height="8" class="app"/>
    <text x="565" y="474" text-anchor="middle" class="lbl">Glossary</text>
  </g>

  <!-- Serving: processes -> service -->
  <path class="serve" d="M130,170 L130,135 L300,135 L300,102"/>
  <path class="serve" d="M335,170 L335,120 L400,120 L400,102"/>
  <path class="serve" d="M565,170 L565,120 L500,120 L500,102"/>
  <path class="serve" d="M770,170 L770,135 L600,135 L600,102"/>

  <!-- Serving: components -> processes -->
  <path class="serve" d="M130,300 L130,236"/>
  <path class="serve" d="M335,300 L335,236"/>
  <path class="serve" d="M565,300 L565,236"/>
  <path class="serve" d="M770,300 L770,236"/>

  <!-- Association: classification tier feeds ROPA -->
  <path class="assoc" d="M220,332 L245,332"/>
  <text x="232" y="326" text-anchor="middle" class="tiny">tier</text>

  <!-- Association: cross-cutting references -->
  <path class="assoc" d="M335,440 L335,364"/>
  <path class="assoc" d="M565,440 L565,364"/>
  <text x="348" y="410" class="tiny">references</text>

  <!-- Legend -->
  <rect x="680" y="430" width="190" height="120" rx="6" fill="none" stroke="#999" stroke-width="1"/>
  <text x="690" y="450" class="lblb" font-size="12">Legend</text>
  <rect x="690" y="460" width="26" height="16" class="biz"/>
  <text x="724" y="472" class="tiny">Business (process / service)</text>
  <rect x="690" y="484" width="26" height="16" class="app"/>
  <text x="724" y="496" class="tiny">Application component (template)</text>
  <line x1="692" y1="514" x2="716" y2="514" class="serve"/>
  <text x="724" y="518" class="tiny">serving</text>
  <line x1="692" y1="532" x2="716" y2="532" class="assoc"/>
  <text x="724" y="536" class="tiny">association</text>
</svg>
