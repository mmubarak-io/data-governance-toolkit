name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The policy-ID sync check reaches into ai-compliance-gates, so drift can
    # appear here without anything in this repo changing.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Repository consistency checks
        run: python3 scripts/check-repo.py
